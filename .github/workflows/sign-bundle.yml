# Signs version-1.luau when a bundle-affecting file lands on main.
#
# Key handling (build spec #4): the Ed25519 private key exists only as the
# SIGNING_KEY repository secret. Contributors never need it — without the
# secret this workflow only *verifies* the committed signature, so local dev
# and PR checks run on throwaway/dev keys (scripts/sign_bundle.js creates a
# gitignored dev key on first use).
#
# Obfuscation (build spec #5) happens outside CI: everything here runs on the
# pre-obfuscation loader.luau artifact, which is the same file contributors
# test.
#
# The verification steps themselves live in _verify.yml so that the release
# pipeline (publish.yml) runs the identical gate against the tagged tree.
name: Sign bundle

on:
  push:
    branches: [main]
    paths:
      - "version-1.luau"
      - "version-1.luau.sig"
      - "loader.luau"
      - "ASTRA_VERSION"
      - "README.md"
      - "scripts/sign_bundle.js"
      - "scripts/check_release_consistency.sh"
      - "scripts/release.sh"
      - "scripts/loader_integrity_test.sh"
      - "scripts/loader_crypto_test.sh"
      - "scripts/check_syntax.sh"
      - ".github/workflows/sign-bundle.yml"
      - ".github/workflows/_verify.yml"
  pull_request:
    paths:
      - "version-1.luau"
      - "version-1.luau.sig"
      - "loader.luau"
      - "ASTRA_VERSION"
      - "README.md"
      - "scripts/sign_bundle.js"
      - "scripts/check_release_consistency.sh"
      - "scripts/release.sh"
      - "scripts/loader_integrity_test.sh"
      - "scripts/loader_crypto_test.sh"
      - "scripts/check_syntax.sh"
      - ".github/workflows/sign-bundle.yml"
      - ".github/workflows/_verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Always runs: version/digest/README/tag consistency, signature digest,
  # syntax gate, crypto vectors, and the end-to-end integrity matrix (tamper /
  # missing / wrong key / stale version / fetch failure / canary trip → silent
  # stub; valid → real API).
  verify:
    uses: ./.github/workflows/_verify.yml

  # Runs only for pushes to main, and only signs when the SIGNING_KEY secret
  # exists. No secret → verify and stop; the workflow never fails a repo that
  # has not onboarded the production key.
  sign:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Re-sign with the CI secret when present (no-op otherwise)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "SIGNING_KEY secret is not set — repository keeps its current"
            echo "committed signature (dev/local key path). CI does not fail."
            node scripts/sign_bundle.js --verify
            exit 0
          fi
          node scripts/sign_bundle.js
          node scripts/sign_bundle.js --verify
          if git diff --quiet -- version-1.luau.sig loader.luau; then
            echo "signature and loader already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version-1.luau.sig loader.luau
          git commit -m "chore: sign version-1.luau [skip ci]"
          git push

      # Signing rewrites loader.luau's PUBLIC_KEY pin, so the pin, the
      # signature and the checksum the README publishes have to be re-checked
      # against each other once the production key has been applied.
      - name: Re-check consistency after signing
        run: sh scripts/check_release_consistency.sh

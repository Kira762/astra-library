name: Discord Push Notification

on:
  push:

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send push details to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "::error::The DISCORD_WEBHOOK_URL repository secret is not configured."
            exit 1
          fi

          if [[ ! -r "${GITHUB_EVENT_PATH}" ]]; then
            echo "::error::The GitHub event payload could not be read."
            exit 1
          fi

          # Build the request with jq so commit messages, author names, and URLs
          # are JSON-escaped correctly, even when they contain quotes or newlines.
          payload="$(jq -c '
            def truncate($value; $limit):
              (($value // "") | tostring) as $text
              | if ($text | length) <= $limit then
                  $text
                elif $limit <= 1 then
                  ($text[0:$limit])
                else
                  (($text[0:($limit - 1)] | rtrimstr(" ")) + "…")
                end;

            def clean_line($value):
              (($value // "(no commit message)") | tostring)
              | gsub("\r"; "")
              | split("\n")[0]
              | gsub("[[:space:]]+"; " ")
              | if length == 0 then "(no commit message)" else . end;

            def author_display($commit; $fallback_username):
              (($commit.author.name // $commit.committer.name // "Unknown author") | tostring) as $name
              | (($commit.author.username // $commit.committer.username // $fallback_username // "unknown") | tostring) as $username
              | ($name + " (@" + $username + ")");

            def commit_summary_lines($commits; $fallback_username):
              $commits
              | map(
                  . as $commit
                  | "- `"
                    + ((($commit.id // "") | tostring)[0:7])
                    + "` — "
                    + truncate((clean_line($commit.message)); 150)
                    + " — "
                    + truncate((author_display($commit; $fallback_username)); 100)
                );

            # Keep the per-commit list inside the Discord field limit. If a push
            # contains more commits than fit, say exactly how many were omitted.
            def summarize_commits($commits; $limit; $fallback_username):
              (commit_summary_lines($commits; $fallback_username)) as $lines
              | (reduce range(0; ($lines | length)) as $i
                  ({lines: [], length: 0, omitted: 0};
                    if .omitted > 0 then
                      .
                    else
                      ($lines[$i]) as $line
                      | (if (.lines | length) > 0 then 1 else 0 end) as $separator
                      | if (.length + $separator + ($line | length)) <= $limit then
                          .lines += [$line]
                          | .length = (.length + $separator + ($line | length))
                        else
                          .omitted = (($lines | length) - $i)
                        end
                    end))
                | (.lines
                   + (if .omitted > 0 then
                        ["… and " + (.omitted | tostring) + " more commit(s)."]
                      else
                        []
                      end))
                | join("\n")
                | truncate(.; $limit);

            . as $event
            | ($event.repository // {}) as $repository
            | ($event.commits // []) as $commits
            | ($event.head_commit // ($commits[-1] // {})) as $head
            | ($event.sender // {}) as $sender
            | ($event.pusher // {}) as $pusher
            | (($event.ref // "") | tostring) as $raw_ref
            | (if ($raw_ref | startswith("refs/heads/")) then
                 ($raw_ref | sub("^refs/heads/"; ""))
               elif ($raw_ref | startswith("refs/tags/")) then
                 ($raw_ref | sub("^refs/tags/"; ""))
               else
                 $raw_ref
               end) as $branch
            | (($branch | if length > 0 then . else "(unknown ref)" end)) as $branch_display
            | (($repository.html_url // ("https://github.com/" + ($repository.full_name // "")))
               | tostring
               | rtrimstr("/")) as $repository_url
            | (($repository.name // $repository.full_name // "Repository") | tostring) as $repository_name
            | (($repository.full_name // $repository_name) | tostring) as $repository_full_name
            | (($sender.login // $pusher.name // "unknown") | tostring) as $fallback_username
            | (($commits | length)) as $commit_count
            | (($head.message // "") | tostring) as $head_message
            | (($head.id // (if $commit_count > 0 then $event.after else "" end) // "") | tostring) as $commit_sha
            | (if ($commit_sha | length) > 0 then
                 ($repository_url + "/commit/" + $commit_sha)
               else
                 $repository_url
               end) as $commit_url
            | (if $commit_count == 0 then
                 "No commit was included in this push."
               elif ($head_message | length) == 0 then
                 "A push was received, but the commit message was empty."
               else
                 truncate($head_message; 4096)
               end) as $description
            | (if $commit_count == 0 then
                 "No commits were included in this push."
               else
                 summarize_commits($commits; 500; $fallback_username)
               end) as $commit_summary
            | ((if $commit_count == 1 then
                  "Pushed 1 commit to " + $branch_display
                else
                  "Pushed " + ($commit_count | tostring) + " commits to " + $branch_display
                end) | truncate(.; 220)) as $title
            | (truncate((author_display($head; $fallback_username)); 180)) as $author
            | (if ($commit_sha | length) > 0 then
                 "[" + ($commit_sha[0:7]) + "](" + $commit_url + ")"
               else
                 "No commit SHA available."
               end) as $commit_field
            | {
                allowed_mentions: {parse: []},
                embeds: [
                  {
                    title: $title,
                    url: $commit_url,
                    color: 3055683,
                    description: $description,
                    fields: [
                      {
                        name: "Repository",
                        value: truncate(("[" + $repository_name + "](" + $repository_url + ")"); 250),
                        inline: true
                      },
                      {
                        name: "Branch",
                        value: truncate($branch_display; 200),
                        inline: true
                      },
                      {
                        name: "Author",
                        value: $author,
                        inline: true
                      },
                      {
                        name: "Commit",
                        value: truncate($commit_field; 300),
                        inline: true
                      },
                      {
                        name: "Commits in this push",
                        value: $commit_summary,
                        inline: false
                      }
                    ],
                    footer: {
                      text: truncate(("GitHub push • " + $repository_full_name); 120)
                    },
                    timestamp: ($head.timestamp // (now | todateiso8601))
                  }
                ]
              }
          ' "${GITHUB_EVENT_PATH}")"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-raw "${payload}" \
            "${DISCORD_WEBHOOK_URL}"

          echo "Discord push notification sent for ${GITHUB_REPOSITORY}."

name: Deploy website to GitHub Pages

# Publishes the Next.js static export in website/ to GitHub Pages:
#   https://kira762.github.io/astra-version-1/
#
# One-time setup (repo owner only):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   https://github.com/Kira762/astra-version-1/settings/pages
# The "Verify GitHub Pages" step below fails with that instruction if it is not
# set yet, instead of letting the deploy step 404 without explanation.
# Docs: https://docs.github.com/pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# `pages: write` uploads the artifact, `id-token: write` lets the deploy job prove
# it is allowed to publish. Both are required by GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reports the Pages URL and its sub-path. `enablement` lets an admin token
      # switch the source to GitHub Actions on the first run; if it cannot, the
      # build still continues and the base path is derived below.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Resolve base path
        id: basepath
        env:
          CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SETUP_OUTCOME: ${{ steps.pages.outcome }}
        run: |
          if [ "$SETUP_OUTCOME" = "success" ]; then
            # configure-pages knows the truth; "" is correct for user/org sites.
            echo "value=$CONFIGURED_BASE_PATH" >> "$GITHUB_OUTPUT"
            echo "Base path from configure-pages: '${CONFIGURED_BASE_PATH}'"
          else
            # Project sites are served from /<repo-name>.
            value="/${GITHUB_REPOSITORY##*/}"
            echo "value=$value" >> "$GITHUB_OUTPUT"
            echo "Base path from repository name: '$value'"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build static site
        working-directory: website
        run: npm run build
        env:
          # Every asset URL must carry the sub-path prefix, otherwise the page
          # loads with no CSS/JS on github.io.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}

      - name: Verify export
        working-directory: website
        run: |
          test -f out/index.html
          base="${{ steps.basepath.outputs.value }}"
          if [ -n "$base" ]; then
            grep -q "\"$base/_next/" out/index.html \
              || { echo "::error::Assets are not prefixed with '$base'"; exit 1; }
          fi
          echo "Exported $(find out -type f | wc -l) files to website/out (base path '$base')"

      # Reads the export back: the viewport meta, safe-area padding, dvh, the
      # coarse-pointer block, print/forced-colours palettes, horizontal
      # scrollers. Fails the deploy rather than shipping a layout that pans
      # sideways on a phone.
      - name: Verify device support
        working-directory: website
        run: npm run check:devices

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pages
          SETTINGS_URL: ${{ github.server_url }}/${{ github.repository }}/settings/pages
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" "$API_URL")
          if [ "$code" != "200" ]; then
            echo "::error title=GitHub Pages not enabled::GET $API_URL returned HTTP $code."
            echo "::error title=Fix::Open $SETTINGS_URL and set Build and deployment -> Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
          build_type=$(jq -r '.build_type // "unknown"' /tmp/pages.json)
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=Wrong Pages source::Pages is enabled with source '$build_type', but this workflow deploys via GitHub Actions."
            echo "::error title=Fix::Open $SETTINGS_URL and set Build and deployment -> Source: GitHub Actions."
            exit 1
          fi
          echo "GitHub Pages is enabled with source: GitHub Actions ($(jq -r '.html_url' /tmp/pages.json))"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
